name: Service checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1
      - run: python -m venv source/.venv
      - run: source/.venv/bin/python -m pip install './source[test]'
      - name: Check installed source CLI and shell runtime
        run: |
          source/.venv/bin/sendspin-karaoke-source check-device --help
          source/.venv/bin/sendspin-karaoke-source record-start --help
          source/.venv/bin/sendspin-karaoke-source recognition-enable --help
          source/.venv/bin/sendspin-karaoke-source recognition-retry --help
          bash -n scripts/install-source.sh
          bash -n scripts/check-source-runtime.sh
          bash -n scripts/source-cli.sh
      - name: Test opt-in capture lifecycle and real paired Sendspin protocol
        run: source/.venv/bin/python -I -B -m unittest discover -s source/tests -p 'test_*.py' -v
      - name: Install optional recognition and test native fingerprinting with mocked HTTP
        run: |
          source/.venv/bin/python -m pip install './source[recognition]'
          source/.venv/bin/python -I -B -m unittest discover -s source/tests -p 'test_recognition.py' -v
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Test native CEC helper and Linux UAPI ABI
        if: runner.os == 'Linux'
        run: python3 -I -B tests/native_cec_test.py
      - name: Test opt-in kiosk cursor setup
        run: python -I -B tests/kiosk_cursor_test.py
      - run: npm run build
      - name: Install script-free production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Exercise production decoder
        run: node --input-type=module -e "import sharp from 'sharp'; import { decodeAmbientImage } from './dist/server/server/ambient-decoder.js'; for (const [width,height,expectedWidth,expectedHeight] of [[64,32,64,32],[4096,2304,3840,2160]]) { const png = await sharp({create:{width,height,channels:3,background:'#789a93'}}).png().toBuffer(); const image = await decodeAmbientImage(png,'image/png'); const info = await sharp(image.data).metadata(); if(info.format !== 'jpeg' || info.width !== expectedWidth || info.height !== expectedHeight) process.exit(1); }"
      - name: Check deployment shell syntax
        if: runner.os == 'Linux'
        run: for script in scripts/*.sh; do bash -n "$script" || exit 1; done
